<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Empleados - API Vet</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, select, button { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; font-size: 15px; box-sizing: border-box; }
        button { background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #2980b9; }
        .btn-back { background: #7f8c8d; margin-top: 5px; }
        .btn-back:hover { background: #606f7b; }
    </style>
</head>
<body>

<div class="container">
    <h2>Registro de Nuevo Empleado</h2>
    <form id="formRegistroEmpleado" onsubmit="registrarNuevoEmpleado(event)">
        <label>Documento:</label>
        <input type="text" id="regDocumento" required>

        <label>Nombre:</label>
        <input type="text" id="regNombre" required>

        <label>Apellido:</label>
        <input type="text" id="regApellido" required>

        <label>Email:</label>
        <input type="email" id="regEmail">

        <label>Teléfono:</label>
        <input type="text" id="regTelefono">

        <label>Cargo:</label>
        <input type="text" id="regCargo" value="Auxiliar">

        <label>Selecciona la Veterinaria y Doctor:</label>
        <select id="regIDVeterinaria" required>
            <option value="">Cargando opciones...</option>
        </select>

        <button type="submit">Completar Registro</button>
    </form>
    
    <a href="index.html">
        <button class="btn-back">Volver al Portal Principal</button>
    </a>
</div>

<script>
    const API_URL = `${window.location.origin}/api`;

    async function cargarClinicasEnFormulario() {
        try {
            const res = await fetch(`${API_URL}/veterinaria`); 
            const json = await res.json();
            const select = document.getElementById('regIDVeterinaria');
            select.innerHTML = '<option value="">-- Selecciona una Veterinaria y Doctor --</option>';
            
            if (json.ok && json.data && json.data.length > 0) {
                json.data.forEach(item => {
                    const id = item.IDVeterinaria;
                    const clinica = item.nombreClinica || 'Sin Clínica';
                    const doctor = item.nombreVet ? `${item.nombreVet} ${item.apellidoVet}` : 'Sin Veterinario asignado';
                    
                    select.innerHTML += `<option value="${id}">${clinica} — Dr(a). ${doctor} (ID: ${id})</option>`;
                });
            } else {
                select.innerHTML = '<option value="">No hay registros disponibles</option>';
            }
        } catch (error) {
            console.error('Error al cargar las opciones:', error);
            document.getElementById('regIDVeterinaria').innerHTML = '<option value="">Error al cargar opciones</option>';
        }
    }

    async function registrarNuevoEmpleado(event) {
        event.preventDefault();
        
        const data = {
            IDVeterinaria: document.getElementById('regIDVeterinaria').value,
            documento: document.getElementById('regDocumento').value,
            nombre: document.getElementById('regNombre').value,
            apellido: document.getElementById('regApellido').value,
            email: document.getElementById('regEmail').value,
            telefono: document.getElementById('regTelefono').value,
            cargo: document.getElementById('regCargo').value
        };

        try {
            const res = await fetch(`${API_URL}/empleados/registro`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const json = await res.json();

            if (json.ok) {
                alert('¡Empleado registrado exitosamente!');
                document.getElementById('formRegistroEmpleado').reset();
            } else {
                alert('Error: ' + json.msg);
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Error de red al intentar registrar el empleado.');
        }
    }

    cargarClinicasEnFormulario();
</script>

</body>
</html>
